# Render Blueprint for Arc (getarc.health). Dashboard → New → Blueprint → this repo, branch main.
# Spec: https://render.com/docs/blueprint-spec · schema: https://render.com/schema/render.yaml.json
services:
  # API: Express + Mongoose, runs from TypeScript source with tsx (a runtime dependency).
  - type: web
    name: getarc-api
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm run start -w backend
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    # Custom domain api.getarc.health is attached in the dashboard (Settings → Custom Domains).
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.19.4
      - key: MONGODB_URI
        sync: false # pasted once in the dashboard: the Atlas connection string
      - key: JWT_SECRET
        generateValue: true
      - key: CV_API_KEY
        generateValue: true # copy from the dashboard and give it to the camera app
      - key: CORS_ORIGINS
        value: https://getarc.health,https://www.getarc.health
      # Arc, the coach. Optional: without them Arc uses its own questions and templates and the
      # browser's voice. Pasted once in the dashboard; never sent to the browser.
      - key: GEMINI_API_KEY
        sync: false # https://aistudio.google.com/apikey
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: ELEVENLABS_API_KEY
        sync: false # https://elevenlabs.io/app/settings/api-keys
      - key: ELEVENLABS_VOICE_ID
        value: 21m00Tcm4TlvDq8ikWAM

  # Web app: static files from frontend/dist. /api/* is rewritten to the API, so the browser keeps
  # same-origin calls and no CORS is involved. Render adds the www → root redirect automatically.
  - type: web
    name: getarc-web
    runtime: static
    buildCommand: npm ci --include=dev && npm run build -w frontend
    staticPublishPath: frontend/dist
    autoDeployTrigger: commit
    # Custom domain getarc.health is attached in the dashboard (Settings → Custom Domains).
    envVars:
      - key: NODE_VERSION
        value: 20.19.4
    routes:
      - type: rewrite
        source: /api/*
        destination: https://getarc-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
